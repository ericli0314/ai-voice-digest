name: Debug Subscribers (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Print subscriber statuses (masked)
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          PYTHONPATH: scripts
        run: |
          python -c "
          import subscribers

          def mask(e):
              name, _, domain = e.partition('@')
              return name[:2] + '***@' + domain

          pending = subscribers.get_pending_unconfirmed()
          confirmed = subscribers.get_confirmed()
          print('pending  :', [(s['id'][:6], mask(s['email'])) for s in pending])
          print('confirmed:', [(s['id'][:6], mask(s['email'])) for s in confirmed])
          "
